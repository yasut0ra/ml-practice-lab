<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">過去で学び、その後の日を確かめる</title>
<desc id="desc">210日の販売個数から昨日と7日前の値を作り、先週の値のない最初の7日を除く。203日のうち最後の30日を最終テストに残す。173日の学習用の中で、学習83日とその後30日、学習113日とその後30日、学習143日とその後30日の3分割で検証する。毎日、前日までの実際の個数を受け取って翌日を予想する条件で、30日先を一度に予想した成績ではない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="800" height="700" rx="18" fill="white"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" fill="#19324d">
<text x="32" y="46" font-size="27" font-weight="600">過去で学び、その後の日を確かめる</text>
<text x="32" y="84" font-size="20">昨日・先週の実績 → 今日の予想（答えはまだ使わない）</text>
<text x="32" y="127" font-size="20">先頭7日を除く203日を、日付順に分ける</text>
<rect x="32" y="146" width="627" height="63" rx="10" fill="#edf4fb"/>
<rect x="659" y="146" width="109" height="63" rx="10" fill="#fff0d7"/>
<text x="345" y="185" font-size="22" text-anchor="middle" font-weight="600">学習用173日</text>
<text x="713" y="172" font-size="18" text-anchor="middle">最終テスト</text>
<text x="713" y="197" font-size="19" text-anchor="middle">30日</text>
<text x="32" y="251" font-size="21" font-weight="600">学習用の中だけで、過去 → 未来の3通りの検証</text>
<rect x="659" y="276" width="109" height="232" rx="10" fill="#fff0d7" opacity="0.6"/>
<g fill="#edf4fb">
<rect x="32" y="280" width="301" height="56" rx="8"/>
<rect x="32" y="360" width="410" height="56" rx="8"/>
<rect x="32" y="440" width="519" height="56" rx="8"/>
</g>
<g fill="#eaf5f0">
<rect x="333" y="280" width="109" height="56" rx="8"/>
<rect x="442" y="360" width="109" height="56" rx="8"/>
<rect x="551" y="440" width="108" height="56" rx="8"/>
</g>
<g font-size="20" text-anchor="middle">
<text x="182" y="315">学習83日</text><text x="387" y="315">検証30日</text>
<text x="237" y="395">学習113日</text><text x="496" y="395">検証30日</text>
<text x="291" y="475">学習143日</text><text x="605" y="475">検証30日</text>
<text x="713" y="383" font-size="19">ここは</text><text x="713" y="413" font-size="19">使わない</text>
</g>
<path d="M32,533 H758" stroke="#53708d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="566" font-size="20" text-anchor="middle">時間が進む。未来の答えで、過去を学習しない。</text>
<rect x="32" y="593" width="736" height="78" rx="12" fill="#eaf5f0"/>
<text x="400" y="623" font-size="20" text-anchor="middle">毎日、前日までの実績を受け取って翌日を予想する。</text>
<text x="400" y="653" font-size="20" text-anchor="middle">30日先まで一度に予想した成績ではない。</text>
</g>
</svg>
