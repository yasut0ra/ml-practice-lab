<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">使い始めたあとも、入力と誤差を確かめる</title>
<desc id="desc">最初に学習したモデルを固定する。答えがまだないときは入力の広さの変化を確認し、MAEは未評価にする。答えが来たら件数と全体・地域ごとの誤差を確認する。架空の比較では基準MAE0.51万円、入力だけ変化0.49万円、関係も変化2.58万円。入力変化だけで精度の低下を断定しない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="800" height="650" rx="18" fill="white"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" fill="#19324d">
<text x="32" y="46" font-size="27" text-anchor="start" font-weight="600">使い始めたあとも、入力と誤差を確かめる</text>
<text x="32" y="85" font-size="20" text-anchor="start">モデルを固定。答えが届く前と後で、見られるものが違う</text>
<rect x="32" y="115" width="344" height="160" rx="12" fill="#edf4fb"/>
<text x="204" y="155" font-size="23" text-anchor="middle" font-weight="600">答えがまだない</text>
<text x="204" y="202" font-size="20" text-anchor="middle">入力の広さ・空欄などを見る</text>
<text x="204" y="245" font-size="22" text-anchor="middle">MAEは「未評価」</text>
<rect x="424" y="115" width="344" height="160" rx="12" fill="#eaf5f0"/>
<text x="596" y="155" font-size="23" text-anchor="middle" font-weight="600">実際の答えが来た</text>
<text x="596" y="202" font-size="20" text-anchor="middle">採点した件数と誤差を見る</text>
<text x="596" y="245" font-size="21" text-anchor="middle">地域ごとのずれも確認</text>
<rect x="32" y="311" width="736" height="174" rx="12" fill="#edf4fb"/>
<text x="400" y="348" font-size="23" text-anchor="middle" font-weight="600">架空の同じモデルでの比較</text>
<text x="160" y="393" font-size="20" text-anchor="middle" font-weight="600">基準</text>
<text x="400" y="393" font-size="20" text-anchor="middle" font-weight="600">入力だけ変化</text>
<text x="640" y="393" font-size="20" text-anchor="middle" font-weight="600">関係も変化</text>
<text x="160" y="427" font-size="22" text-anchor="middle">MAE 0.51</text>
<text x="400" y="427" font-size="22" text-anchor="middle">MAE 0.49</text>
<text x="640" y="427" font-size="22" text-anchor="middle">MAE 2.58</text>
<text x="400" y="464" font-size="19" text-anchor="middle">単位は万円。後の二つは同じ入力の仮想の比較。</text>
<text x="400" y="530" font-size="24" text-anchor="middle" font-weight="600">入力が変わる ≠ 必ず精度が下がる</text>
<text x="400" y="573" font-size="21" text-anchor="middle">悪化の理由を確認し、新しい実験は別に評価する。</text>
<text x="400" y="615" font-size="20" text-anchor="middle">モデルカードに、用途・限界・確認の結果を残す。</text>
</g>
</svg>
