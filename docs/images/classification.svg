<svg xmlns="http://www.w3.org/2000/svg" width="720" height="458" viewBox="0 0 720 458" role="img" aria-labelledby="title desc">
<title id="title">分類は「どの種類？」を当てる</title>
<desc id="desc">花の測定値から品種A、B、Cのいずれかを予測する。模式図では丸、四角、三角が異なる品種。出力が数字の番号でも、種類を当てるので分類。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="458" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">分類は「どの種類？」を当てる</text>
<rect x="32" y="91" width="248" height="105" rx="14" fill="#edf3fb"/><text x="156.0" y="128" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">入力：花の測定値</text><text x="156.0" y="162" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">花びらの長さ・幅など</text><path d="M290,143 L407,143" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="348" y="120" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">分類モデル</text><rect x="422" y="91" width="266" height="105" rx="14" fill="#e6f4ee"/><text x="555.0" y="128" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">出力：品種の名前</text><text x="555.0" y="162" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">A・B・C のどれか</text><path d="M100,236 V366 H620" fill="none" stroke="#53708d" stroke-width="2"/><circle cx="148" cy="334" r="8" fill="#2b6cb0"/><circle cx="175" cy="316" r="8" fill="#2b6cb0"/><circle cx="187" cy="341" r="8" fill="#2b6cb0"/><circle cx="203" cy="321" r="8" fill="#2b6cb0"/><circle cx="216" cy="304" r="8" fill="#2b6cb0"/><rect x="325" y="275" width="16" height="16" rx="2" fill="#318065"/><rect x="348" y="300" width="16" height="16" rx="2" fill="#318065"/><rect x="372" y="262" width="16" height="16" rx="2" fill="#318065"/><rect x="391" y="282" width="16" height="16" rx="2" fill="#318065"/><rect x="413" y="261" width="16" height="16" rx="2" fill="#318065"/><path d="M491,237 L501,255 L481,255 Z" fill="#aa5a21"/><path d="M520,256 L530,274 L510,274 Z" fill="#aa5a21"/><path d="M545,222 L555,240 L535,240 Z" fill="#aa5a21"/><path d="M577,244 L587,262 L567,262 Z" fill="#aa5a21"/><path d="M598,208 L608,226 L588,226 Z" fill="#aa5a21"/><text x="174" y="397" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">● 品種A</text><text x="370" y="397" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">■ 品種B</text><text x="556" y="397" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">▲ 品種C</text><text x="360" y="434" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">点1つ ＝ 花1つ（配置は説明用の模式図）</text>
</g>
</svg>
