<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">間違い方を4つのマスで見る</title>
<desc id="desc">行は実際の普通・迷惑、列は予測した普通・迷惑。TN4件、FP1件、FN2件、TP3件。accuracy70%、precision75%、recall60%。説明用の架空のメール。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="490" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">間違い方を4つのマスで見る</text>
<text x="360" y="82" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">例：迷惑メールを見つけたい（架空の10件）</text><text x="429" y="120" font-size="23" text-anchor="middle" fill="#19324d" font-weight="400">予測した種類 →</text><text x="302" y="159" font-size="22" text-anchor="middle" fill="#19324d" font-weight="400">普通（0）</text><text x="551" y="159" font-size="22" text-anchor="middle" fill="#19324d" font-weight="400">迷惑（1）</text><text x="105" y="204" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">実際の</text><text x="105" y="235" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">種類 ↓</text><text x="105" y="290" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">普通（0）</text><text x="105" y="395" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">迷惑（1）</text><rect x="186" y="180" width="242" height="112" rx="14" fill="#e6f4ee"/><text x="307.0" y="217" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">4件</text><text x="307.0" y="251" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">TN：正しい判定</text><rect x="440" y="180" width="242" height="112" rx="14" fill="#fff2dc"/><text x="561.0" y="217" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">1件</text><text x="561.0" y="251" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">FP：誤検知</text><rect x="186" y="306" width="242" height="112" rx="14" fill="#fff2dc"/><text x="307.0" y="343" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">2件</text><text x="307.0" y="377" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">FN：見逃し</text><rect x="440" y="306" width="242" height="112" rx="14" fill="#e6f4ee"/><text x="561.0" y="343" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">3件</text><text x="561.0" y="377" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">TP：正しい検出</text><text x="360" y="465" font-size="22" text-anchor="middle" fill="#19324d" font-weight="400">正解率だけでなく、間違えた場所も見る</text>
</g>
</svg>
