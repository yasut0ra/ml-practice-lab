<svg xmlns="http://www.w3.org/2000/svg" width="800" height="670" viewBox="0 0 800 670" role="img" aria-labelledby="title desc">
<title id="title">同じ人の記録は、まとめて分ける</title>
<desc id="desc">3人が4件ずつ持つ記録の分割の模式図。行を混ぜると同じ人の記録が学習と検証の両方に入る。人ごとの分割ではAとBを学習、Cを検証にし、重複しない。実行例は60人240行で、新しい12人を最終テストに残す。</desc>
