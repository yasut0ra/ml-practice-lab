<text x="400" y="566" font-size="20" text-anchor="middle">一つの分割の模式図。実行では48人を3分割。</text>
<text x="400" y="605" font-size="21" text-anchor="middle">240行は60人分の記録。行の件数と人数は別。</text>
<text x="400" y="639" font-size="20" text-anchor="middle">番号は分割に使い、予想の手がかりには入れない。</text>
