<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">4つの測定値を、2つの新しい軸にまとめる</title>
<desc id="desc">花のがく片の長さと幅、花びらの長さと幅の4列を、学習用から求めた尺度で標準化する。PCAは品種の答えを使わず、広がりを残せる2つの新しい軸を作る。新しい花は同じ軸に変換する。品種による色付けは変換後に行い、寄与率は正解率ではない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="800" height="600" rx="18" fill="white"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" fill="#19324d">
<text x="32" y="46" font-size="27" font-weight="600">4つの測定値を、2つの新しい軸にまとめる</text>
<text x="32" y="82" font-size="20">PCA：元の列を組み合わせて、新しい座標を作る</text>
<rect x="32" y="112" width="276" height="250" rx="14" fill="#edf4fb"/>
<text x="170" y="152" text-anchor="middle" font-size="23" font-weight="600">花の測定値：4列</text>
<g font-size="21">
<text x="58" y="197">がく片の長さ</text><text x="58" y="237">がく片の幅</text>
<text x="58" y="277">花びらの長さ</text><text x="58" y="317">花びらの幅</text>
</g>
<path d="M313,238 H371" stroke="#53708d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="345" y="202" text-anchor="middle" font-size="18">標準化</text>
<text x="345" y="283" text-anchor="middle" font-size="18">PCA</text>
<rect x="384" y="112" width="384" height="250" rx="14" fill="#eaf5f0"/>
<text x="576" y="152" text-anchor="middle" font-size="23" font-weight="600">新しい座標：2列</text>
<path d="M440,310 H728 M470,332 V174" stroke="#53708d" stroke-width="2"/>
<text x="688" y="340" font-size="18">第1軸</text>
<text x="405" y="190" font-size="18">第2軸</text>
<g fill="#53708d"><circle cx="505" cy="286" r="7"/><circle cx="527" cy="272" r="7"/><circle cx="539" cy="290" r="7"/><circle cx="575" cy="252" r="7"/><circle cx="592" cy="245" r="7"/><circle cx="615" cy="257" r="7"/><circle cx="657" cy="211" r="7"/><circle cx="680" cy="200" r="7"/><circle cx="687" cy="227" r="7"/></g>
<text x="576" y="384" text-anchor="middle" font-size="18">点は仕組みを示す模式図</text>
<rect x="32" y="406" width="736" height="78" rx="12" fill="#edf4fb"/>
<text x="55" y="438" font-size="21">学習用から「尺度」と「軸」を決める</text>
<text x="55" y="470" font-size="21">新しい花も同じ尺度・軸で変換する</text>
<rect x="32" y="500" width="736" height="77" rx="12" fill="#fff6e9"/>
<text x="55" y="532" font-size="20">品種の答えは軸を作るときに使わない。色付けは後から。</text>
<text x="55" y="563" font-size="20">寄与率＝残せたばらつきの割合。分類の正解率とは違う。</text>
</g>
</svg>
