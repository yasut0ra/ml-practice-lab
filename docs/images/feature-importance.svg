<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">1列を入れ替え、ずれの増加を測る</title>
<desc id="desc">仕組みを示す3部屋の確認用データ。元の広さ20、40、60を60、20、40へ入れ替え、部屋番号と家賃の答えは保つ。同じ学習済みモデルで元のMAEと入れ替え後のMAEを比べる。各列で10回繰り返し、モデルは学び直さない。重要度は原因の証明ではない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="800" height="650" rx="18" fill="white"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" fill="#19324d">
<text x="32" y="46" font-size="27" text-anchor="start" font-weight="600">1列を入れ替え、ずれの増加を測る</text>
<text x="32" y="81" font-size="20" text-anchor="start">モデルは固定。確認用の「広さ」だけを混ぜてみる</text>
<rect x="32" y="112" width="320" height="219" rx="12" fill="#edf4fb"/>
<text x="192" y="149" font-size="22" text-anchor="middle" font-weight="600">元の確認用</text>
<rect x="142" y="166" width="94" height="145" rx="12" fill="#fff0d7"/>
<text x="82" y="191" font-size="19" text-anchor="middle" font-weight="600">部屋</text>
<text x="192" y="191" font-size="19" text-anchor="middle" font-weight="600">広さ</text>
<text x="300" y="191" font-size="19" text-anchor="middle" font-weight="600">家賃</text>
<text x="82" y="227" font-size="20" text-anchor="middle">A</text>
<text x="192" y="227" font-size="20" text-anchor="middle">20㎡</text>
<text x="300" y="227" font-size="20" text-anchor="middle">6万円</text>
<text x="82" y="262" font-size="20" text-anchor="middle">B</text>
<text x="192" y="262" font-size="20" text-anchor="middle">40㎡</text>
<text x="300" y="262" font-size="20" text-anchor="middle">10万円</text>
<text x="82" y="297" font-size="20" text-anchor="middle">C</text>
<text x="192" y="297" font-size="20" text-anchor="middle">60㎡</text>
<text x="300" y="297" font-size="20" text-anchor="middle">14万円</text>
<rect x="448" y="112" width="320" height="219" rx="12" fill="#edf4fb"/>
<text x="608" y="149" font-size="22" text-anchor="middle" font-weight="600">広さだけを入れ替え</text>
<rect x="558" y="166" width="94" height="145" rx="12" fill="#fff0d7"/>
<text x="498" y="191" font-size="19" text-anchor="middle" font-weight="600">部屋</text>
<text x="608" y="191" font-size="19" text-anchor="middle" font-weight="600">広さ</text>
<text x="716" y="191" font-size="19" text-anchor="middle" font-weight="600">家賃</text>
<text x="498" y="227" font-size="20" text-anchor="middle">A</text>
<text x="608" y="227" font-size="20" text-anchor="middle">60㎡</text>
<text x="716" y="227" font-size="20" text-anchor="middle">6万円</text>
<text x="498" y="262" font-size="20" text-anchor="middle">B</text>
<text x="608" y="262" font-size="20" text-anchor="middle">20㎡</text>
<text x="716" y="262" font-size="20" text-anchor="middle">10万円</text>
<text x="498" y="297" font-size="20" text-anchor="middle">C</text>
<text x="608" y="297" font-size="20" text-anchor="middle">40㎡</text>
<text x="716" y="297" font-size="20" text-anchor="middle">14万円</text>
<path d="M360,240 H438" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="400" y="362" font-size="19" text-anchor="middle">仕組みを示す3行の例。他の列と答えは変えない。</text>
<rect x="32" y="388" width="736" height="68" rx="12" fill="#eaf5f0"/>
<text x="400" y="431" font-size="22" text-anchor="middle" font-weight="600">同じ学習済みPipelineで予測し、それぞれMAEを測る</text>
<rect x="32" y="474" width="736" height="66" rx="12" fill="#edf4fb"/>
<text x="400" y="516" font-size="23" text-anchor="middle" font-weight="600">重要度 ＝ 入れ替え後のMAE − 元のMAE</text>
<text x="400" y="576" font-size="20" text-anchor="middle">各列で10回入れ替え、増加の平均とばらつきを見る</text>
<text x="400" y="616" font-size="20" text-anchor="middle">モデルの使い方の目安。家賃の原因を証明する値ではない。</text>
</g>
</svg>
