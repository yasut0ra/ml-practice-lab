<svg xmlns="http://www.w3.org/2000/svg" width="720" height="448" viewBox="0 0 720 448" role="img" aria-labelledby="title desc">
<title id="title">同じ分類でも、考え方が違う</title>
<desc id="desc">左のSVMは2種類の点の間に境界線を学ぶ。右のk-NNは未知の点から近い3点が丸2個、三角1個なので、同じ重みの多数決で丸の種類と予測する。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="448" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">同じ分類でも、考え方が違う</text>
<text x="177" y="96" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">SVM：境界を学ぶ</text><text x="545" y="96" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">k-NN：近い例を見る</text><path d="M360,115 V365" stroke="#d5dfe9" stroke-width="2"/><circle cx="58" cy="180" r="8" fill="#2b6cb0"/><circle cx="87" cy="245" r="8" fill="#2b6cb0"/><circle cx="124" cy="193" r="8" fill="#2b6cb0"/><circle cx="98" cy="300" r="8" fill="#2b6cb0"/><circle cx="141" cy="269" r="8" fill="#2b6cb0"/><path d="M225,162 L235,180 L215,180 Z" fill="#aa5a21"/><path d="M268,202 L278,220 L258,220 Z" fill="#aa5a21"/><path d="M250,288 L260,306 L240,306 Z" fill="#aa5a21"/><path d="M300,253 L310,271 L290,271 Z" fill="#aa5a21"/><path d="M306,170 L316,188 L296,188 Z" fill="#aa5a21"/><path d="M202,140 L173,337" stroke="#318065" stroke-width="3"/><text x="177" y="379" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">種類の間に線を引く</text><circle cx="427" cy="151" r="8" fill="#2b6cb0"/><circle cx="448" cy="267" r="8" fill="#2b6cb0"/><circle cx="539" cy="255" r="8" fill="#2b6cb0"/><circle cx="577" cy="293" r="8" fill="#2b6cb0"/><path d="M661,189 L671,207 L651,207 Z" fill="#aa5a21"/><path d="M646,303 L656,321 L636,321 Z" fill="#aa5a21"/><path d="M606,206 L616,224 L596,224 Z" fill="#aa5a21"/><path d="M510,139 L520,157 L500,157 Z" fill="#aa5a21"/><circle cx="556" cy="242" r="60" stroke="#53708d" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text x="556" y="249" font-size="29" text-anchor="middle" fill="#19324d" font-weight="600">?</text><text x="544" y="379" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">近い3件：● 2個、▲ 1個</text><text x="360" y="423" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">● と ▲ は別の種類。位置は説明用の模式図</text>
</g>
</svg>
