<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" role="img" aria-labelledby="title desc">
<title id="title">データを、使える形に整える</title>
<desc id="desc">数値の列は中央値で空欄を埋め、標準化する。文字の列は最頻値で空欄を埋め、種類ごとに0と1の列に変える。ColumnTransformerで両者を合わせ、Pipelineでモデルにつなぐ。基準は学習データだけから求める。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="566" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">データを、使える形に整える</text>
<rect x="32" y="96" width="260" height="96" rx="14" fill="#edf3fb"/><text x="162.0" y="133" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">数値の列</text><text x="162.0" y="167" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">年齢・収入</text><path d="M305,144 L411,144" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="424" y="96" width="264" height="96" rx="14" fill="#fff2dc"/><text x="556.0" y="133" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">空欄を埋める</text><text x="556.0" y="167" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習用の中央値で補完</text><path d="M555,203 L555,239" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="424" y="251" width="264" height="90" rx="14" fill="#edf3fb"/><text x="556.0" y="288" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">尺度をそろえる</text><text x="556.0" y="322" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習用の平均・ばらつき</text><rect x="32" y="251" width="260" height="90" rx="14" fill="#edf3fb"/><text x="162.0" y="288" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">文字の列</text><text x="162.0" y="322" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">都市・プラン</text><path d="M162,354 L162,389" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="32" y="401" width="260" height="96" rx="14" fill="#e6f4ee"/><text x="162.0" y="438" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">空欄を埋めて変換</text><text x="162.0" y="472" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">Tokyo → [1, 0, …]</text><path d="M555,353 L555,441" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M305,448 L411,448" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="424" y="401" width="264" height="96" rx="14" fill="#e6f4ee"/><text x="556.0" y="438" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">合わせてモデルへ</text><text x="556.0" y="472" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">順番を Pipeline にまとめる</text><text x="360" y="542" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">基準を学ぶのは学習用だけ。確認用には同じ処理を使う</text>
</g>
</svg>
