<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">機械学習は「例から学んで、予想する」</title>
<desc id="desc">家賃の架空の例。過去の入力と答えからfitで学習し、新しい広さ30平方メートルをpredictに渡して8万円と予測。実際の家賃と比較して評価する。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="430" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">機械学習は「例から学んで、予想する」</text>
<text x="32" y="87" font-size="22" text-anchor="start" fill="#19324d" font-weight="400">① 過去の例で学ぶ</text><rect x="32" y="105" width="250" height="94" rx="14" fill="#edf3fb"/><text x="157.0" y="142" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">入力 X と 答え y</text><text x="157.0" y="176" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">広さと実際の家賃</text><path d="M294,152 L399,152" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="348" y="131" font-size="22" text-anchor="middle" fill="#19324d" font-weight="400">fit</text><rect x="414" y="105" width="274" height="94" rx="14" fill="#e6f4ee"/><text x="551.0" y="142" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">学習したモデル</text><text x="551.0" y="176" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">予想する規則を見つける</text><text x="32" y="240" font-size="22" text-anchor="start" fill="#19324d" font-weight="400">② 新しい入力で予想する</text><rect x="32" y="260" width="184" height="94" rx="14" fill="#edf3fb"/><text x="124.0" y="297" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">新しい入力</text><text x="124.0" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">広さ30㎡</text><path d="M225,307 L265,307" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="278" y="260" width="164" height="94" rx="14" fill="#e6f4ee"/><text x="360.0" y="297" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">同じモデル</text><text x="360.0" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">predict</text><path d="M451,307 L490,307" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="503" y="260" width="185" height="94" rx="14" fill="#fff2dc"/><text x="595.5" y="297" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">予測した答え</text><text x="595.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">家賃8万円</text><text x="360" y="397" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">③ 実際の家賃が9万円なら、ずれは1万円 → 評価</text>
</g>
</svg>
