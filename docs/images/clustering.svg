<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-labelledby="title desc">
<title id="title">クラスタリングは、似たものを集める</title>
<desc id="desc">同じ点を分ける前と分けた後。正解ラベルを渡さず、位置が近い点を3つのグループに分ける。番号の0、1、2に順位や意味はない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="452" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">クラスタリングは、似たものを集める</text>
<text x="171" y="95" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">答えのないデータ</text><text x="550" y="95" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">近い点をグループに</text><circle cx="70" cy="200" r="8" fill="#53708d"/><circle cx="450" cy="200" r="8" fill="#2b6cb0"/><circle cx="90" cy="177" r="8" fill="#53708d"/><circle cx="470" cy="177" r="8" fill="#2b6cb0"/><circle cx="110" cy="221" r="8" fill="#53708d"/><circle cx="490" cy="221" r="8" fill="#2b6cb0"/><circle cx="123" cy="187" r="8" fill="#53708d"/><circle cx="503" cy="187" r="8" fill="#2b6cb0"/><circle cx="81" cy="233" r="8" fill="#53708d"/><circle cx="461" cy="233" r="8" fill="#2b6cb0"/><circle cx="207" cy="172" r="8" fill="#53708d"/><rect x="579" y="164" width="16" height="16" rx="2" fill="#318065"/><circle cx="230" cy="189" r="8" fill="#53708d"/><rect x="602" y="181" width="16" height="16" rx="2" fill="#318065"/><circle cx="250" cy="152" r="8" fill="#53708d"/><rect x="622" y="144" width="16" height="16" rx="2" fill="#318065"/><circle cx="270" cy="181" r="8" fill="#53708d"/><rect x="642" y="173" width="16" height="16" rx="2" fill="#318065"/><circle cx="246" cy="218" r="8" fill="#53708d"/><rect x="618" y="210" width="16" height="16" rx="2" fill="#318065"/><circle cx="173" cy="294" r="8" fill="#53708d"/><path d="M553,284 L563,302 L543,302 Z" fill="#aa5a21"/><circle cx="193" cy="326" r="8" fill="#53708d"/><path d="M573,316 L583,334 L563,334 Z" fill="#aa5a21"/><circle cx="225" cy="296" r="8" fill="#53708d"/><path d="M605,286 L615,304 L595,304 Z" fill="#aa5a21"/><circle cx="207" cy="274" r="8" fill="#53708d"/><path d="M587,264 L597,282 L577,282 Z" fill="#aa5a21"/><circle cx="248" cy="315" r="8" fill="#53708d"/><path d="M628,305 L638,323 L618,323 Z" fill="#aa5a21"/><path d="M319,243 L389,243" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="360" y="382" font-size="23" text-anchor="middle" fill="#19324d" font-weight="400">グループ数を指定する：この例は3つ</text><text x="360" y="425" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">0・1・2という番号に、順位や名前の意味はない</text>
</g>
</svg>
