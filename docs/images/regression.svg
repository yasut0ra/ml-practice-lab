<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img" aria-labelledby="title desc">
<title id="title">点と予測の「ずれ」を見る</title>
<desc id="desc">架空の家賃データ。横軸は部屋の広さ、縦軸は家賃。青い点が実際の答え、緑の線が予測。点と線の縦の距離が予測誤差。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="445" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">点と予測の「ずれ」を見る</text>
<text x="360" y="82" font-size="23" text-anchor="middle" fill="#19324d" font-weight="400">回帰 ＝ 数値を予想する</text><path d="M120,110 V325 H620" fill="none" stroke="#53708d" stroke-width="2"/><text x="38" y="195" font-size="23" text-anchor="start" fill="#19324d" font-weight="400">家賃</text><text x="34" y="226" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">万円</text><text x="366" y="383" font-size="22" text-anchor="middle" fill="#19324d" font-weight="400">部屋の広さ（㎡）</text><text x="210" y="354" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">20</text><text x="390" y="354" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">40</text><text x="570" y="354" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">60</text><text x="103" y="292" font-size="20" text-anchor="end" fill="#19324d" font-weight="400">6</text><text x="103" y="212" font-size="20" text-anchor="end" fill="#19324d" font-weight="400">10</text><text x="103" y="132" font-size="20" text-anchor="end" fill="#19324d" font-weight="400">14</text><path d="M165,305 L610,107" stroke="#318065" stroke-width="4" fill="none"/><circle cx="210" cy="285" r="8" fill="#2b6cb0"/><circle cx="270" cy="279" r="8" fill="#2b6cb0"/><circle cx="330" cy="216" r="8" fill="#2b6cb0"/><circle cx="390" cy="160" r="8" fill="#2b6cb0"/><circle cx="450" cy="170" r="8" fill="#2b6cb0"/><circle cx="570" cy="128" r="8" fill="#2b6cb0"/><path d="M390,170 V205" stroke="#c66324" stroke-width="4"/><rect x="382" y="197" width="16" height="16" rx="2" fill="#318065"/><text x="412" y="199" font-size="21" text-anchor="start" fill="#a94e16" font-weight="400">この点の誤差</text><circle cx="168" cy="407" r="8" fill="#2b6cb0"/><text x="186" y="413" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">点：実際の答え</text><path d="M402,407 H430" stroke="#318065" stroke-width="4"/><text x="444" y="413" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">線：予測</text>
</g>
</svg>
