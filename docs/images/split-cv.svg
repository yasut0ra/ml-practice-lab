<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">初めての問題で、実力を確かめる</title>
<desc id="desc">まず学習用と最終テスト用を分ける。学習用の中だけで5分割し、1つを検証用、残りを学習用にする。検証の区画を順番に入れ替え、毎回新しく学習して評価する。テストはCVに使わない。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="550" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">初めての問題で、実力を確かめる</text>
<text x="32" y="90" font-size="22" text-anchor="start" fill="#19324d" font-weight="400">① 最後の確認用を、先に取っておく</text><rect x="32" y="108" width="470" height="90" rx="14" fill="#edf3fb"/><text x="267.0" y="145" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">学習用（train）</text><text x="267.0" y="179" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">この中でモデルや設定を比べる</text><rect x="516" y="108" width="172" height="90" rx="14" fill="#fff2dc"/><text x="602.0" y="145" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">テスト用</text><text x="602.0" y="179" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">最後に確認</text><text x="32" y="240" font-size="22" text-anchor="start" fill="#19324d" font-weight="400">② 学習用を5つに分けて、確認する部分を交代</text><text x="32" y="288" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">1回目</text><rect x="135" y="260" width="83" height="37" rx="6" fill="#fff2dc"/><text x="176.5" y="286" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">検証</text><rect x="226" y="260" width="83" height="37" rx="6" fill="#edf3fb"/><text x="267.5" y="286" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="317" y="260" width="83" height="37" rx="6" fill="#edf3fb"/><text x="358.5" y="286" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="408" y="260" width="83" height="37" rx="6" fill="#edf3fb"/><text x="449.5" y="286" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="499" y="260" width="83" height="37" rx="6" fill="#edf3fb"/><text x="540.5" y="286" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><text x="32" y="333" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">2回目</text><rect x="135" y="305" width="83" height="37" rx="6" fill="#edf3fb"/><text x="176.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="226" y="305" width="83" height="37" rx="6" fill="#fff2dc"/><text x="267.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">検証</text><rect x="317" y="305" width="83" height="37" rx="6" fill="#edf3fb"/><text x="358.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="408" y="305" width="83" height="37" rx="6" fill="#edf3fb"/><text x="449.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="499" y="305" width="83" height="37" rx="6" fill="#edf3fb"/><text x="540.5" y="331" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><text x="32" y="378" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">3回目</text><rect x="135" y="350" width="83" height="37" rx="6" fill="#edf3fb"/><text x="176.5" y="376" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="226" y="350" width="83" height="37" rx="6" fill="#edf3fb"/><text x="267.5" y="376" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="317" y="350" width="83" height="37" rx="6" fill="#fff2dc"/><text x="358.5" y="376" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">検証</text><rect x="408" y="350" width="83" height="37" rx="6" fill="#edf3fb"/><text x="449.5" y="376" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="499" y="350" width="83" height="37" rx="6" fill="#edf3fb"/><text x="540.5" y="376" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><text x="32" y="423" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">4回目</text><rect x="135" y="395" width="83" height="37" rx="6" fill="#edf3fb"/><text x="176.5" y="421" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="226" y="395" width="83" height="37" rx="6" fill="#edf3fb"/><text x="267.5" y="421" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="317" y="395" width="83" height="37" rx="6" fill="#edf3fb"/><text x="358.5" y="421" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="408" y="395" width="83" height="37" rx="6" fill="#fff2dc"/><text x="449.5" y="421" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">検証</text><rect x="499" y="395" width="83" height="37" rx="6" fill="#edf3fb"/><text x="540.5" y="421" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><text x="32" y="468" font-size="20" text-anchor="start" fill="#19324d" font-weight="400">5回目</text><rect x="135" y="440" width="83" height="37" rx="6" fill="#edf3fb"/><text x="176.5" y="466" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="226" y="440" width="83" height="37" rx="6" fill="#edf3fb"/><text x="267.5" y="466" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="317" y="440" width="83" height="37" rx="6" fill="#edf3fb"/><text x="358.5" y="466" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="408" y="440" width="83" height="37" rx="6" fill="#edf3fb"/><text x="449.5" y="466" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">学習</text><rect x="499" y="440" width="83" height="37" rx="6" fill="#fff2dc"/><text x="540.5" y="466" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">検証</text><text x="636" y="324" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">テストは</text><text x="636" y="354" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">使わない</text><text x="360" y="521" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">毎回学び直す → 5回の成績の平均とばらつきを見る</text>
</g>
