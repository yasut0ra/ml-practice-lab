<text x="32" y="85" font-size="20" text-anchor="start">入力 → 中間の計算 → 0〜9のどれかを予想</text>
<text x="142" y="139" font-size="22" text-anchor="middle" font-weight="600">入力64画素</text>
<text x="421" y="139" font-size="22" text-anchor="middle" font-weight="600">中間32ユニット</text>
<text x="668" y="139" font-size="22" text-anchor="middle" font-weight="600">出力10種類</text>
