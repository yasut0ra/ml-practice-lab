<text x="400" y="474" font-size="22" text-anchor="middle" font-weight="600">つながりの「重み」を、例から少しずつ更新する</text>
<text x="400" y="513" font-size="21" text-anchor="middle">合計する → 曲げる処理（ReLU） → 次の層へ</text>
<text x="400" y="579" font-size="21" text-anchor="middle">学習lossは小さいほど良い。正解率とは別の量。</text>
<text x="400" y="617" font-size="20" text-anchor="middle">内部検証で止める。最終テストで止め方を決めない。</text>
