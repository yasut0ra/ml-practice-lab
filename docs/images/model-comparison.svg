<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc">
  <title id="title">条件をそろえて、方法を比べる</title>
  <desc id="desc">同じデータと同じ5回の分割で、単純な基準と4種類のモデルをaccuracyとF1で比較する。学習用だけで平均とばらつきを見て選び、最終評価には別のテストデータを使う。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#53708d" />
    </marker>
  </defs>
  <rect width="720" height="630" rx="18" fill="#ffffff" />
  <g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
    <text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">条件をそろえて、方法を比べる</text>
    <rect x="32" y="92" width="656" height="92" rx="14" fill="#edf3fb" />
    <text x="360.0" y="129" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">同じデータ・同じ5回の分割</text>
    <text x="360.0" y="163" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">同じ問題を、同じ採点方法で比べる</text>
    <rect x="32" y="204" width="266" height="51" rx="14" fill="#edf3fb" />
    <text x="165.0" y="241" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">LogisticRegression</text>
    <path d="M310,230 L409,230" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
    <text x="430" y="237" font-size="21" text-anchor="start" fill="#19324d" font-weight="400">accuracy・F1 を計測</text>
    <rect x="32" y="267" width="266" height="51" rx="14" fill="#edf3fb" />
    <text x="165.0" y="304" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">RandomForest</text>
    <path d="M310,293 L409,293" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
    <text x="430" y="300" font-size="21" text-anchor="start" fill="#19324d" font-weight="400">accuracy・F1 を計測</text>
    <rect x="32" y="330" width="266" height="51" rx="14" fill="#edf3fb" />
    <text x="165.0" y="367" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">SVM</text>
    <path d="M310,356 L409,356" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
    <text x="430" y="363" font-size="21" text-anchor="start" fill="#19324d" font-weight="400">accuracy・F1 を計測</text>
    <rect x="32" y="393" width="266" height="51" rx="14" fill="#edf3fb" />
    <text x="165.0" y="430" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">k-NN</text>
    <path d="M310,419 L409,419" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
    <text x="430" y="426" font-size="21" text-anchor="start" fill="#19324d" font-weight="400">accuracy・F1 を計測</text>
    <text x="360" y="563" font-size="24" text-anchor="middle" fill="#19324d" font-weight="600">5回の平均 ＋ ばらつきを比べる</text>
    <text x="360" y="606" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">今回の条件で良い方法を選ぶ → 最後は別のテストで確認</text>
    <rect x="32" y="456" width="266" height="51" rx="14" fill="#fff2dc" />
    <text font-size="21" text-anchor="middle" fill="#19324d" font-weight="600" x="165" y="493">Baseline（単純な基準）</text>
    <path stroke-width="2.5" fill="none" marker-end="url(#arrow)" d="M310,482 L409,482" stroke="#53708d" />
    <text font-size="21" text-anchor="start" fill="#19324d" x="430" y="489">accuracy・F1 を計測</text>
  </g>
</svg>
