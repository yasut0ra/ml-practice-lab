<svg xmlns="http://www.w3.org/2000/svg" width="720" height="585" viewBox="0 0 720 585" role="img" aria-labelledby="title desc">
<title id="title">決定木は、質問をたどって判断する</title>
<desc id="desc">模式図。花びらが長くなければ品種A、長ければ幅で品種BかCに分岐する。ランダムフォレストはデータや特徴量に違いのある複数の木の予測を組み合わせる。実際のコードは診断データ。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#53708d"/></marker></defs>
<rect width="720" height="585" rx="18" fill="#ffffff"/>
<g font-family="'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif">
<text x="32" y="45" font-size="27" text-anchor="start" fill="#19324d" font-weight="600">決定木は、質問をたどって判断する</text>
<rect x="230" y="91" width="260" height="78" rx="14" fill="#edf3fb"/><text x="360.0" y="128" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">花びらは長い？</text><path d="M257,183 L161,213" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="192" y="193" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">いいえ</text><path d="M463,183 L559,213" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="538" y="193" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">はい</text><rect x="32" y="226" width="236" height="78" rx="14" fill="#e6f4ee"/><text x="150.0" y="263" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">品種A と予想</text><rect x="386" y="226" width="302" height="78" rx="14" fill="#edf3fb"/><text x="537.0" y="263" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">幅は広い？</text><path d="M471,318 L430,350" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="430" y="328" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">いいえ</text><path d="M602,318 L643,350" stroke="#53708d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="654" y="328" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">はい</text><rect x="327" y="365" width="169" height="78" rx="14" fill="#e6f4ee"/><text x="411.5" y="402" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">品種B</text><rect x="519" y="365" width="169" height="78" rx="14" fill="#e6f4ee"/><text x="603.5" y="402" font-size="23" text-anchor="middle" fill="#19324d" font-weight="600">品種C</text><text x="32" y="482" font-size="22" text-anchor="start" fill="#19324d" font-weight="400">森 ＝ 違いのある木を組み合わせる</text><text x="360" y="523" font-size="21" text-anchor="middle" fill="#19324d" font-weight="400">木1の予測 ＋ 木2の予測 ＋ 木3の予測 → まとめる</text><text x="360" y="561" font-size="20" text-anchor="middle" fill="#19324d" font-weight="400">質問の条件と順番は、学習データから見つける</text>
</g>
</svg>
