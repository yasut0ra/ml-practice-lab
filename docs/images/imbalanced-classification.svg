<title id="title">95%正解しても、不良品を見つけたとは限らない</title>
<desc id="desc">正常95個、不良品5個の100個を例にする。全て正常と答えると正解率95%だが、不良品を見つけるrecallは0%。サンプルでは学習用562件でモデルを学び、検証用188件でしきい値を選び、最後に別の250件で確認する。</desc>
