<text x="644" y="140" font-size="22" text-anchor="middle" font-weight="600">正常：95個</text>
<text x="644" y="178" font-size="22" text-anchor="middle" font-weight="600">不良：5個</text>
<text x="644" y="216" font-size="19" text-anchor="middle">見つけたいのは不良品</text>
