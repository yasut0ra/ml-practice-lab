<text x="55" y="304" font-size="23" text-anchor="start" font-weight="600">全部「正常」と答える → 正解率95%</text>
<text x="55" y="344" font-size="21" text-anchor="start">不良品5個のうち見つけたのは0個 → recallは0%</text>
<text x="32" y="408" font-size="22" text-anchor="start" font-weight="600">しきい値を選ぶときも、データの役割を分ける</text>
